[project]
name = "translation-unit-tests"
version = "0.1.0"
description = "AI-generated unit tests for MT/LLM translation engines, compared with segment-level QE"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "openai>=2.54.0",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "sacrebleu>=2.6.0",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]

# CPU-only PyTorch wheels (local embedding models run on CPU)
[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
