name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests (no network)
        run: uv run pytest -q
      - name: README matches the committed results
        run: uv run python -m analysis --check

  replay:
    # Re-run both studies from the shipped LLM responses and require byte-identical results.
    runs-on: ubuntu-latest
    env:
      L10N_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m common.cache restore
      - name: "Study B: regenerate the suite, run all engines and QE, adjudicate"
        run: |
          rm results/mtunit/suite.generated.json results/mtunit/suite.json results/mtunit/validation.json
          uv run python -m mtunit.run
          uv run python -m mtunit.adjudicate
      - name: "Study A: plant and verify errors, run every check, diagnose detections"
        run: |
          uv run python -m benchmark.plant
          uv run python -m benchmark.run
      - name: Outputs are unchanged
        run: git diff --exit-code --stat results/
